<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مولّد QR للاستبيان</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#f6f5f2; --card:#fff; --ink:#1d2430; --muted:#646f7e; --line:#e3e1dc;
         --accent:#1b4e7c; --orange:#ef8f3c; box-sizing:border-box; }
  *,*::before,*::after{box-sizing:inherit}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:"Cairo","Segoe UI",Tahoma,sans-serif;font-size:16px;line-height:1.75}
  .wrap{max-width:640px;margin:0 auto;padding:20px 16px 50px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:14px}
  h1{font-size:1.3rem;margin:0 0 6px}
  .sub{color:var(--muted);font-size:.92rem;margin:0 0 16px}
  label{display:block;font-weight:600;margin-bottom:6px;font-size:.95rem}
  input,select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;
        font-family:inherit;font-size:1rem;background:#fff;color:var(--ink);direction:ltr;text-align:left}
  select{direction:rtl;text-align:right}
  .row2{display:flex;gap:10px;margin-top:12px}
  .row2 > div{flex:1}
  button{font-family:inherit;font-size:1rem;cursor:pointer;display:block;width:100%;
         padding:13px 18px;border-radius:12px;border:none;background:var(--accent);color:#fff;
         font-weight:600;margin-top:12px}
  button.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
  .err{color:#b4524a;font-size:.9rem;margin-top:10px}

  /* الكارت اللي هيتطبع */
  #poster{background:#fff;border-radius:18px;padding:26px 22px 22px;text-align:center;
          border:1px solid var(--line);margin-top:4px}
  #poster .logo{height:62px;margin-bottom:6px}
  #poster .meet{font-size:.82rem;color:#646f7e;margin-bottom:16px}
  #poster h2{font-size:1.5rem;margin:0 0 4px;color:#1b4e7c}
  #poster .tag{color:#ef8f3c;font-weight:600;font-size:.92rem;margin-bottom:18px}
  #poster .qrbox{display:inline-block;padding:14px;background:#fff;border:3px solid #1b4e7c;border-radius:16px}
  #poster canvas{display:block}
  #poster .cta{font-size:1.05rem;font-weight:600;margin:16px 0 4px}
  #poster .url{font-size:.74rem;color:#646f7e;direction:ltr;word-break:break-all}
  @media print{
    body{background:#fff}
    .noprint{display:none !important}
    .wrap{padding:0;max-width:none}
    #poster{border:none;margin:0;padding:40px}
    #poster .qrbox{border-color:#1b4e7c}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="card noprint">
    <h1>مولّد الـ QR للاستبيان</h1>
    <p class="sub">حطّي لينك الاستبيان بعد ما ترفعيه على Vercel، وهيطلعلك كود الشباب يصوّروه بالكاميرا ويفتح عندهم على طول.</p>

    <label for="url">لينك الاستبيان</label>
    <input id="url" type="url" placeholder="https://doubt-survey.vercel.app" value="">

    <div class="row2">
      <div>
        <label for="title">العنوان على الكارت</label>
        <input id="title" type="text" value="استبيان الشك للشباب" style="direction:rtl;text-align:right">
      </div>
      <div>
        <label for="size">حجم الكود</label>
        <select id="size">
          <option value="6">عادي</option>
          <option value="8" selected>كبير</option>
          <option value="11">كبير جداً (للطباعة)</option>
        </select>
      </div>
    </div>

    <button id="gen">اعمل الكود</button>
    <button id="dl" class="ghost">نزّل الكود صورة PNG</button>
    <button id="prt" class="ghost">اطبع الكارت</button>
    <div class="err" id="err"></div>
  </div>

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };

  function draw(url, scale){
    var q = qrcode(0, "M");
    q.addData(url);
    q.make();
    var n = q.getModuleCount();
    var quiet = 4;
    var px = scale;
    var side = (n + quiet*2) * px;
    var cv = $("cv");
    cv.width = side; cv.height = side;
    var ctx = cv.getContext("2d");
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, side, side);
    ctx.fillStyle = "#17202b";
    for(var r=0; r<n; r++){
      for(var c=0; c<n; c++){
        if(q.isDark(r, c)){
          ctx.fillRect((c+quiet)*px, (r+quiet)*px, px, px);
        }
      }
    }
    cv.style.width = Math.min(260, side) + "px";
    cv.style.height = Math.min(260, side) + "px";
  }

  function gen(){
    var url = $("url").value.trim();
    $("err").textContent = "";
    if(!url){ $("err").textContent = "اكتبي اللينك الأول."; return false; }
    if(!/^https?:\/\//i.test(url)){ url = "https://" + url; $("url").value = url; }
    try{
      draw(url, parseInt($("size").value, 10) * 3);
      $("pUrl").textContent = url;
      $("pTitle").textContent = $("title").value.trim() || "استبيان الشك للشباب";
      return true;
    }catch(e){
      $("err").textContent = "اللينك طويل أوي على الكود. جرّبي لينك أقصر.";
      return false;
    }
  }

  $("gen").addEventListener("click", gen);
  $("url").addEventListener("keydown", function(e){ if(e.key === "Enter") gen(); });

  $("dl").addEventListener("click", function(){
    if(!gen()) return;
    var a = document.createElement("a");
    a.href = $("cv").toDataURL("image/png");
    a.download = "qr-survey.png";
    a.click();
  });

  $("prt").addEventListener("click", function(){
    if(!gen()) return;
    setTimeout(function(){ window.print(); }, 120);
  });
})();
</script>
</body>
